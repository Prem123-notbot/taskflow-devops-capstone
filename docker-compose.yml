services:
  taskflow:
    build: .
    image: ${APP_IMAGE:-taskflow-devops-capstone:latest}
    container_name: taskflow-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      COOKIE_SECURE: "false"
      APP_VERSION: ${APP_VERSION:-1.0.0}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-secret-before-sharing}
      DATA_DIR: /app/data
    volumes:
      - taskflow_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  taskflow_data:
